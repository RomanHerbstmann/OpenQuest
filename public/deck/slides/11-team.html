<section class="slide s11" data-seconds="15">
  <h2 class="display display-sm rise">
    <span lang="de">Das Team.</span>
    <span lang="en">The team.</span>
  </h2>

  <figure class="s11-photo rise" style="--d: 1">
    <img id="s11-img" src="assets/team.jpg" data-de-alt="Gruppenfoto des OpenQuest-Teams" data-en-alt="Group photo of the OpenQuest team" hidden />
    <div class="s11-placeholder" id="s11-placeholder">
      <img src="assets/logo-cards.png" alt="" />
      <span class="pixel"><span lang="de">Gruppenfoto folgt</span><span lang="en">Group photo coming</span></span>
    </div>
  </figure>

  <p class="s11-names rise" style="--d: 2">Simon · Roman · Raion · Leon</p>
</section>
<script>
  (() => {
    const img = document.getElementById('s11-img');
    const ph = document.getElementById('s11-placeholder');
    img.addEventListener('load', () => { img.hidden = false; ph.hidden = true; });
    if (img.complete && img.naturalWidth) { img.hidden = false; ph.hidden = true; }
  })();
</script>
<style>
  .s11 { gap: clamp(18px, 3.6vh, 44px); }
  .s11 .s11-photo { margin: 0; width: min(100%, calc((100vh - 64px - 300px) * 16 / 9), 1200px); aspect-ratio: 16 / 9; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--surface); }
  .s11 .s11-photo > img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .s11 .s11-placeholder { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; height: 100%; background: var(--parchment); color: var(--bark); }
  .s11 .s11-photo [hidden] { display: none; }
  .s11 .s11-placeholder img { width: clamp(60px, 9vh, 110px); image-rendering: pixelated; }
  .s11 .s11-placeholder .pixel { font-size: clamp(12px, 1vw, 16px); }
  .s11 .s11-names { margin: 0; font: 400 clamp(14px, 1.3vw, 22px)/1 var(--pixel); color: var(--bark); letter-spacing: .04em; }
</style>
