# Start everything:   docker compose up -d --build
# API:                http://localhost:5076 (admin password: docker compose logs api | grep "admin")
# Importer logs:      docker compose logs -f importer
# One-off command:    docker compose run --rm importer sync de-muenster-trees --force
#
# The API owns the database schema: it applies the EF Core migrations and seeds the
# asset types on start. The importer waits for that, then imports the open data.
# To run the API with `dotnet run` instead: docker compose up -d db minio importer

services:
  db:
    image: postgis/postgis:17-3.5
    # The official image is amd64 only; Apple Silicon runs it through emulation.
    platform: linux/amd64
    environment:
      POSTGRES_USER: openquest
      POSTGRES_PASSWORD: openquest
      POSTGRES_DB: openquest
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U openquest -d openquest"]
      interval: 5s
      timeout: 3s
      retries: 20

  # The official minio/minio image is no longer published on Docker Hub; the frozen Bitnami legacy
  # image is fine for local development. Any S3-compatible server works (see Storage__* settings).
  minio:
    image: bitnamilegacy/minio:latest
    environment:
      MINIO_ROOT_USER: openquest
      MINIO_ROOT_PASSWORD: openquest-secret
      MINIO_DEFAULT_BUCKETS: openquest-photos,openquest-snapshots
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/bitnami/minio/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      # Development: non-secret defaults from appsettings.Development.json, a random JWT key per start
      # and a generated admin password printed once in the log. Don't use this setup in production.
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=db;Port=5432;Database=openquest;Username=openquest;Password=openquest
      Storage__ServiceUrl: http://minio:9000
    ports:
      - "5076:8080"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped

  importer:
    build:
      context: .
      dockerfile: apps/importer/Dockerfile
    environment:
      DATABASE_URL: postgresql://openquest:openquest@db:5432/openquest
      # Sync all sources on start and then every interval (default: daily), and whenever an admin asks
      # for it (POST /admin/sync in the API). 0 = sync once and exit (unless SYNC_ON_REQUEST=true).
      SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-86400}
      # Raw downloads go to MinIO, so that the API can offer them to admins (GET /admin/sync/runs/{id}/snapshot).
      # Remove these five lines to keep them in the `snapshots` volume instead.
      OPENQUEST_SNAPSHOT_BACKEND: s3
      OPENQUEST_SNAPSHOT_S3_URL: http://minio:9000
      OPENQUEST_SNAPSHOT_S3_BUCKET: openquest-snapshots
      OPENQUEST_SNAPSHOT_S3_ACCESS_KEY: openquest
      OPENQUEST_SNAPSHOT_S3_SECRET_KEY: openquest-secret
    volumes:
      - snapshots:/app/data/snapshots
      - importer-cache:/app/data/cache
    depends_on:
      db:
        condition: service_healthy
      # The importer waits until the API has created the schema (see docker-entrypoint.sh).
      api:
        condition: service_started
      minio:
        condition: service_started
    restart: unless-stopped

volumes:
  db-data:
  minio-data:
  snapshots:
  importer-cache:
