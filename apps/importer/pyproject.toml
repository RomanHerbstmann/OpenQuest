[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openquest-importer"
version = "0.1.0"
description = "Imports municipal open data (e.g. tree inventories) into the OpenQuest database."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "TBD" }
dependencies = [
    "psycopg[binary]>=3.2",
    "jsonschema>=4.23",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
openquest-importer = "openquest_importer.cli:main"

# Adapters shipped with this package. Adapters from other packages register
# themselves under the same entry point group, see README.
[project.entry-points."openquest.adapters"]
"de_muenster.trees" = "openquest_importer.adapters.de_muenster.trees:MuensterTreesAdapter"
"de_muenster.natural_monuments" = "openquest_importer.adapters.de_muenster.natural_monuments:MuensterNaturalMonumentsAdapter"
"de_nrw.strassen_trees" = "openquest_importer.adapters.de_nrw.strassen_trees:StrassenNrwTreesAdapter"
"open311.reports" = "openquest_importer.adapters.open311.reports:Open311ReportsAdapter"
"dwd.soil_daily" = "openquest_importer.adapters.dwd.soil:DwdSoilDailyAdapter"

[project.entry-points."openquest.enrichers"]
"de_nrw.ndom_height" = "openquest_importer.enrichers.de_nrw.ndom:NdomHeightEnricher"
"de_nrw.alleen" = "openquest_importer.enrichers.de_nrw.alleen:AlleenEnricher"
"geo.area_name" = "openquest_importer.enrichers.geo_areas:AreaNameEnricher"

[tool.hatch.build.targets.wheel]
packages = ["src/openquest_importer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
