<!doctype html>
<html lang="de" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OpenQuest Bäume</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230d1319'/%3E%3Ccircle cx='16' cy='13' r='8' fill='%23199e70'/%3E%3Crect x='14.5' y='18' width='3' height='9' rx='1' fill='%234aa3e8'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/vendor/maplibre-gl.css" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body class="is-hero">
  <div id="map" aria-label="Karte"></div>
  <div class="scrim"></div>

  <div class="toggles">
    <button id="lang" class="toggle mono" type="button" aria-label="Sprache">EN</button>
    <button id="theme" class="toggle" type="button" aria-label="Theme">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="1.6"/><g stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></g></svg>
    </button>
  </div>

  <section class="search" aria-label="Suche">
    <div class="hero-text">
      <div class="eyebrow mono" data-i18n="eyebrow"></div>
      <h1 data-i18n="title"></h1>
      <p class="lede" id="lede"></p>
    </div>
    <form id="form" autocomplete="off">
      <svg class="icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <input id="q" type="search" data-i18n-placeholder="placeholder" aria-label="Suche" />
      <span class="kbd mono" id="status"></span>
    </form>
    <div class="chips" id="examples"></div>
  </section>

  <aside class="panel" id="panel" hidden>
    <div class="panel-head">
      <div class="summary" id="summary"></div>
      <button class="close" id="close" type="button" aria-label="Schließen">×</button>
    </div>
    <div class="interp" id="interp"></div>
    <div class="note" id="note" hidden></div>
    <ol class="results" id="results"></ol>
  </aside>

  <div class="legend" id="legend"></div>

  <script src="/vendor/maplibre-gl.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
